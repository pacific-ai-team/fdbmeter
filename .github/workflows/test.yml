name: Go Test
on: [ push, pull_request ]

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.26.7"
      - name: Install FoundationDB Client C bindings
        env:
          FDB_VERSION: '7.3.7'
          FDB_CLIENTS_DEB_SHA256_SUM: '1b620971319c3ad149f2fb09b2fed639fb558120a296538133c4f2358836e983'
        shell: bash
        run: |
          wget "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          echo "${FDB_CLIENTS_DEB_SHA256_SUM}  foundationdb-clients_${FDB_VERSION}-1_amd64.deb" | sha256sum --check
          sudo dpkg --force-all -i foundationdb-clients_${FDB_VERSION}-1_amd64.deb
      - name: Identify Go and native build inputs
        id: inputs
        shell: bash
        env:
          FIXTURES: ${{ hashFiles('testdata/**', 'go.mod', 'go.sum', '.github/workflows/test.yml') }}
        run: |
          set -euo pipefail
          : "${ImageVersion:?missing runner image version}"
          fingerprint=$(
            {
              printf '%s\n' "$ImageVersion" "$FIXTURES"
              go version
              go env GOOS GOARCH CC CGO_ENABLED GOFLAGS
              gcc --version
              dpkg-query -W foundationdb-clients
            } | sha256sum | cut -d' ' -f1
          )
          echo "prefix=fdbmeter-go-v1-$fingerprint-" >> "$GITHUB_OUTPUT"
          echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore passing Go build and test cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.inputs.outputs.path }}
          key: ${{ steps.inputs.outputs.prefix }}${{ hashFiles('**/*.go', '**/*.c', '**/*.h', '**/*.s', '**/*.S') }}
          restore-keys: ${{ steps.inputs.outputs.prefix }}
      - name: Go information
        run: |
          go version
          go env
      - name: Run tests
        run: go test -v -shuffle=on ./...
      - name: Run tests with race detector
        run: go test -v -race ./...